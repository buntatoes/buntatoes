<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160" role="img" aria-labelledby="title desc">
  <title id="title">tty / buntos@linux</title>
  <desc id="desc">Black-and-white goth tty. Hover a command for the local note. White caret on the idle prompt.</desc>
  <defs>
    <style>
      <![CDATA[
        .ui {
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          font-size: 11px;
        }
        .mono {
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          font-size: 13.5px;
        }
        .wash { fill: #ffffff; fill-opacity: 0; }
        .hint { fill: #8a8a8a; opacity: 0; }
        .cmd { fill: #e8e8e8; fill-opacity: 0.72; }
        .edge { stroke: #2e2e2e; }
        .row { cursor: default; }
        .row:hover .wash { fill-opacity: 0.08; }
        .row:hover .hint { opacity: 1; }
        .row:hover .cmd { fill-opacity: 1; }
        .row:hover .edge { stroke: #e8e8e8; }
        .caret { fill: #ffffff; }
        svg:hover .chrome { fill: #ffffff; }
        @media (prefers-reduced-motion: no-preference) {
          .caret { animation: blink 1.15s steps(1, end) infinite; }
        }
        @media (prefers-reduced-motion: reduce) {
          .caret { animation: none; }
        }
        @keyframes blink { 50% { opacity: 0; } }
      ]]>
    </style>
  </defs>

  <rect width="1100" height="160" fill="#000000"/>
  <rect x="0.5" y="0.5" width="1099" height="159" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="1"/>

  <path d="M1 16V1H16" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M1084 1H1099V16" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M1099 144V159H1084" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <path d="M16 159H1V144" fill="none" stroke="#8a8a8a" stroke-width="1"/>

  <rect x="1" y="1" width="1098" height="30" fill="#000000"/>
  <line x1="1" y1="31.5" x2="1099" y2="31.5" stroke="#2e2e2e" stroke-width="1"/>
  <line x1="16" y1="32.5" x2="1084" y2="32.5" stroke="#1a1a1a" stroke-width="1"/>

  <rect x="16" y="13" width="6" height="6" fill="#2e2e2e"/>
  <rect x="28" y="13" width="6" height="6" fill="#8a8a8a"/>
  <rect x="40" y="13" width="6" height="6" fill="#e8e8e8"/>
  <text class="ui chrome" x="56" y="19" fill="#8a8a8a">tty / buntos@linux</text>
  <text class="ui" x="1084" y="19" text-anchor="end" fill="#8a8a8a">local</text>

  <g class="row">
    <rect class="wash" x="8" y="40" width="1084" height="28"/>
    <path class="edge" d="M8 44v20" fill="none" stroke="#2e2e2e" stroke-width="1"/>
    <text class="mono" x="22" y="59">
      <tspan fill="#ffffff">buntos</tspan><tspan fill="#8a8a8a">@linux</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#e8e8e8">~</tspan><tspan fill="#8a8a8a">$ </tspan><tspan class="cmd">./chorusdraft bluesky review</tspan><tspan class="hint">  # review stays local</tspan>
    </text>
  </g>

  <g class="row">
    <rect class="wash" x="8" y="70" width="1084" height="28"/>
    <path class="edge" d="M8 74v20" fill="none" stroke="#2e2e2e" stroke-width="1"/>
    <text class="mono" x="22" y="89">
      <tspan fill="#ffffff">buntos</tspan><tspan fill="#8a8a8a">@linux</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#e8e8e8">~</tspan><tspan fill="#8a8a8a">$ </tspan><tspan class="cmd">load unpacked adaegis/</tspan><tspan class="hint">  # no store, no telemetry</tspan>
    </text>
  </g>

  <text class="mono" x="22" y="119">
    <tspan fill="#ffffff">buntos</tspan><tspan fill="#8a8a8a">@linux</tspan><tspan fill="#8a8a8a">:</tspan><tspan fill="#e8e8e8">~</tspan><tspan fill="#8a8a8a">$ </tspan><tspan class="caret">_</tspan>
  </text>
</svg>
