<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="160" viewBox="0 0 1100 160" role="img" aria-labelledby="title desc">
  <title id="title">buntos@linux</title>
  <desc id="desc">Quiet tty: hover ./chorusdraft bluesky review or load unpacked adaegis/ for a short comment.</desc>
  <defs>
    <clipPath id="panel">
      <rect x="0.5" y="0.5" width="1099" height="159" rx="10"/>
    </clipPath>
    <pattern id="scan-head" width="1100" height="3" patternUnits="userSpaceOnUse">
      <rect width="1100" height="1" fill="#6ea37a" opacity="0.12"/>
      <rect y="2" width="1100" height="1" fill="#7a2433" opacity="0.08"/>
    </pattern>
    <pattern id="scan-body" width="1100" height="5" patternUnits="userSpaceOnUse">
      <rect width="1100" height="1" fill="#c9b8a6" opacity="0.03"/>
    </pattern>
  </defs>
  <style>
    .ui {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
      font-size: 10.5px;
      letter-spacing: 0.18em;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace;
      font-size: 13.5px;
    }
    .wash { fill: #6e4a7a; fill-opacity: 0; }
    .hint { fill: #7a2433; fill-opacity: 0; opacity: 0; }
    .cmd { fill: #c9b8a6; fill-opacity: 0.92; }
    .row { cursor: default; }
    .row:hover .wash { fill-opacity: 0.18; }
    .row:hover .hint { fill-opacity: 1; opacity: 1; }
    .row:hover .cmd { fill-opacity: 1; }
    .caret { fill: #6ea37a; }
    @media (prefers-reduced-motion: no-preference) {
      .caret { animation: blink 1.15s steps(1, end) infinite; }
    }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#panel)">
    <rect width="1100" height="160" fill="#050508"/>
    <rect width="1100" height="160" fill="url(#scan-body)"/>
    <rect width="1100" height="32" fill="#0c0e12"/>
    <rect width="1100" height="32" fill="url(#scan-head)"/>
    <rect width="3" height="32" fill="#7a2433"/>
    <line x1="0" y1="32.5" x2="1100" y2="32.5" stroke="#2a2d36"/>
  </g>

  <rect x="0.5" y="0.5" width="1099" height="159" rx="10" fill="none" stroke="#2a2d36"/>

  <circle cx="20" cy="16.5" r="3.6" fill="#7a2433"/>
  <circle cx="35" cy="16.5" r="3.6" fill="#6e4a7a"/>
  <circle cx="50" cy="16.5" r="3.6" fill="#6ea37a" opacity="0.75"/>
  <text class="ui" x="68" y="20.5" fill="#c9b8a6">TTY  &#183;  BUNTOS@LINUX</text>
  <text class="ui" x="1078" y="20.5" text-anchor="end" fill="#6ea37a" opacity="0.72">LOCAL</text>

  <g class="row">
    <rect class="wash" x="8" y="40" width="1084" height="28" rx="4"/>
    <text class="mono" x="22" y="59" xml:space="preserve"><tspan fill="#6ea37a">buntos</tspan><tspan fill="#6ea37a" fill-opacity="0.45">@linux</tspan><tspan fill="#c9b8a6" fill-opacity="0.28">:</tspan><tspan fill="#6ea37a">~</tspan><tspan fill="#c9b8a6" fill-opacity="0.55">$ </tspan><tspan class="cmd">./chorusdraft bluesky review</tspan><tspan class="hint">  # review is the default</tspan></text>
  </g>

  <g class="row">
    <rect class="wash" x="8" y="70" width="1084" height="28" rx="4"/>
    <text class="mono" x="22" y="89" xml:space="preserve"><tspan fill="#6ea37a">buntos</tspan><tspan fill="#6ea37a" fill-opacity="0.45">@linux</tspan><tspan fill="#c9b8a6" fill-opacity="0.28">:</tspan><tspan fill="#6ea37a">~</tspan><tspan fill="#c9b8a6" fill-opacity="0.55">$ </tspan><tspan class="cmd">load unpacked adaegis/</tspan><tspan class="hint">  # no store, no telemetry</tspan></text>
  </g>

  <text class="mono" x="22" y="119" xml:space="preserve"><tspan fill="#6ea37a">buntos</tspan><tspan fill="#6ea37a" fill-opacity="0.45">@linux</tspan><tspan fill="#c9b8a6" fill-opacity="0.28">:</tspan><tspan fill="#6ea37a">~</tspan><tspan fill="#c9b8a6" fill-opacity="0.55">$ </tspan><tspan class="caret">_</tspan></text>
</svg>
