<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="title desc">
  <title id="title">tty, a moonlight memory of linux</title>
  <desc id="desc">Abstract dreamlike memory of a terminal: fog, moonlight, whispered holdfast, chorusdraft, and adaegis. Idle SMIL drift. Not a CRT.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#0c1124"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e4f0" stop-opacity="0.5"/>
      <stop offset="38%" stop-color="#9bb0d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7aa3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog-rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a5b8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c4a5b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog-teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa3b8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#7aa3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fog-pale" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9bb0d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9bb0d4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="220" fill="url(#night)"/>

  <ellipse cx="926" cy="44" rx="170" ry="108" fill="url(#moon)">
    <animate attributeName="cx" values="926;904;926" dur="28s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.72;1;0.72" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <circle cx="948" cy="38" r="16" fill="#e8e4f0" opacity="0.2">
    <animate attributeName="opacity" values="0.12;0.28;0.12" dur="9s" repeatCount="indefinite"/>
  </circle>

  <ellipse cx="210" cy="168" rx="300" ry="92" fill="url(#fog-rose)">
    <animate attributeName="cx" values="210;268;210" dur="24s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.95;0.5" dur="18s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="700" cy="158" rx="340" ry="86" fill="url(#fog-teal)">
    <animate attributeName="cx" values="700;656;700" dur="26s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="158;138;158" dur="20s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="500" cy="36" rx="240" ry="72" fill="url(#fog-pale)">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="500;530;500" dur="22s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#9bb0d4" opacity="0.35">
    <circle cx="180" cy="28" r="1.4">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="412" cy="22" r="1.1">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="9s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="18" r="1.3">
      <animate attributeName="opacity" values="0.12;0.48;0.12" dur="8s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="34" r="1.2">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="11s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="56" y="42" fill="#9bb0d4" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="13" opacity="0.62">tty, remembered</text>
  <text x="1044" y="42" text-anchor="end" fill="#7aa3b8" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="13" opacity="0.48">linux</text>

  <text font-family="Georgia, 'Iowan Old Style', Times, serif" x="58" y="86" opacity="0.16" fill="#e8e4f0" font-size="18">
    buntos at linux ~
    <animate attributeName="opacity" values="0.08;0.22;0.08" dur="13s" repeatCount="indefinite"/>
  </text>

  <text font-family="Georgia, 'Iowan Old Style', Times, serif" x="56" y="88" fill="#e8e4f0">
    <tspan font-size="22">buntos</tspan>
    <tspan font-size="16" fill="#c4a5b8">  at  </tspan>
    <tspan font-size="22" fill="#9bb0d4">linux</tspan>
    <tspan font-size="16" fill="#7aa3b8" opacity="0.55">  ~</tspan>
  </text>

  <text x="56" y="122" fill="#e8e4f0" font-family="Georgia, 'Iowan Old Style', Times, serif" font-style="italic" font-size="16" opacity="0.42">
    holdfast · the lock stays on
    <animate attributeName="opacity" values="0.22;0.72;0.22" dur="10s" repeatCount="indefinite"/>
  </text>
  <text x="58" y="124" fill="#9bb0d4" font-family="Georgia, 'Iowan Old Style', Times, serif" font-style="italic" font-size="16" opacity="0.12">
    holdfast · the lock stays on
    <animate attributeName="x" values="58;64;58" dur="18s" repeatCount="indefinite"/>
  </text>

  <text x="56" y="148" fill="#c4a5b8" font-family="Georgia, 'Iowan Old Style', Times, serif" font-style="italic" font-size="15" opacity="0.36">
    chorusdraft · bluesky review
    <animate attributeName="opacity" values="0.16;0.58;0.16" dur="12s" begin="1.8s" repeatCount="indefinite"/>
  </text>

  <text x="420" y="148" fill="#7aa3b8" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="12" opacity="0.28">
    adaegis, unpacked
    <animate attributeName="opacity" values="0.12;0.4;0.12" dur="15s" begin="3s" repeatCount="indefinite"/>
  </text>

  <text x="56" y="174" fill="#9bb0d4" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="13" opacity="0.32">
    specpulse · ringzero
    <animate attributeName="opacity" values="0.14;0.42;0.14" dur="14s" begin="2.4s" repeatCount="indefinite"/>
  </text>

  <text x="56" y="200" fill="#7aa3b8" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="18" opacity="0.5">$</text>
  <rect x="80" y="188" width="11" height="2.4" rx="1.2" fill="#e8e4f0" opacity="0.7">
    <animate attributeName="opacity" values="0.18;0.88;0.18" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <text x="1044" y="200" text-anchor="end" fill="#9bb0d4" font-family="Georgia, 'Iowan Old Style', Times, serif" font-size="12" opacity="0.3">no store, no telemetry</text>
</svg>
