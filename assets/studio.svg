<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="380" viewBox="0 0 1100 380" role="img" aria-labelledby="studio-title studio-desc" font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Monaco, Consolas, Liberation Mono, monospace">
  <title id="studio-title">Buntos studio: ChorusDraft review queue and AdAegis blocker popup</title>
  <desc id="studio-desc">Void desktop with two instrument windows. Hover a window to isolate it. ChorusDraft lights Approve. AdAegis brightens the blocked count and pause actions.</desc>
  <defs>
    <pattern id="scan" width="1100" height="4" patternUnits="userSpaceOnUse">
      <rect width="1100" height="1" fill="#2a2d36" opacity="0.28"/>
    </pattern>
    <clipPath id="clip-cd">
      <rect x="28" y="42" width="512" height="300"/>
    </clipPath>
    <clipPath id="clip-aa">
      <rect x="560" y="42" width="512" height="300"/>
    </clipPath>
    <style>
      <![CDATA[
        .desktop { pointer-events: none; }
        .window { pointer-events: all; cursor: default; transition: opacity 0.22s ease; }
        .frame, .tick, .rail, .focus-tag { transition: stroke 0.22s ease, opacity 0.22s ease, fill 0.22s ease; }
        .desktop:hover .window { opacity: 0.34; }
        .desktop:hover .window:hover { opacity: 1; }
        .win-cd:hover .frame,
        .win-cd:focus-within .frame { stroke: #6e4a7a; }
        .win-aa:hover .frame,
        .win-aa:focus-within .frame { stroke: #6ea37a; }
        .win-cd:hover .tick,
        .win-cd:focus-within .tick { stroke: #6e4a7a; }
        .win-aa:hover .tick,
        .win-aa:focus-within .tick { stroke: #6ea37a; }
        .win-cd:hover .rail,
        .win-cd:focus-within .rail { opacity: 1; }
        .win-aa:hover .rail,
        .win-aa:focus-within .rail { opacity: 1; }
        .win-cd:hover .focus-tag,
        .win-cd:focus-within .focus-tag { opacity: 1; fill: #6e4a7a; }
        .win-aa:hover .focus-tag,
        .win-aa:focus-within .focus-tag { opacity: 1; fill: #6ea37a; }
        .approve-bg { transition: fill 0.2s ease, stroke 0.2s ease; }
        .approve-label { transition: fill 0.2s ease; }
        .approve-glow { transition: opacity 0.2s ease; }
        .win-cd:hover .approve-bg,
        .win-cd:focus-within .approve-bg { fill: #7a2433 !important; stroke: #7a2433 !important; }
        .win-cd:hover .approve-label,
        .win-cd:focus-within .approve-label { fill: #c9b8a6 !important; }
        .win-cd:hover .approve-glow,
        .win-cd:focus-within .approve-glow { opacity: 0.22 !important; }
        .approve:hover .approve-bg { fill: #6e4a7a !important; stroke: #6e4a7a !important; }
        .count, .status, .pause-bg, .pause-label, .popup { transition: fill 0.2s ease, stroke 0.2s ease; }
        .win-aa:hover .count,
        .win-aa:focus-within .count { fill: #c9b8a6 !important; }
        .win-aa:hover .status,
        .win-aa:focus-within .status { fill: #6ea37a !important; }
        .win-aa:hover .popup,
        .win-aa:focus-within .popup { stroke: #6ea37a !important; }
        .win-aa:hover .pause-bg,
        .win-aa:focus-within .pause-bg { stroke: #6ea37a !important; }
        .pause:hover .pause-bg { fill: #7a2433 !important; stroke: #7a2433 !important; }
        .pause:hover .pause-label { fill: #c9b8a6 !important; }
        .eq { transform-box: fill-box; transform-origin: center bottom; transition: transform 0.22s ease; }
        .win-cd:hover .eq1 { transform: scaleY(1.18); }
        .win-cd:hover .eq2 { transform: scaleY(0.86); }
        .win-cd:hover .eq3 { transform: scaleY(1.12); }
        .pending-dot { animation: pulse 2.6s ease-in-out infinite; }
        .live-dot { animation: pulse 2.8s ease-in-out infinite; }
        @keyframes pulse {
          0%, 100% { opacity: 0.35; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <rect width="1100" height="380" fill="#050508"/>
  <rect width="1100" height="380" fill="url(#scan)" pointer-events="none"/>

  <rect width="1100" height="28" fill="#0c0e12"/>
  <rect x="0" y="27" width="1100" height="1" fill="#2a2d36"/>
  <rect x="10" y="7" width="70" height="14" fill="#7a2433"/>
  <text x="45" y="17.5" text-anchor="middle" fill="#c9b8a6" font-size="10">studio</text>
  <text x="92" y="17.5" fill="#c9b8a6" font-size="10">01:review*</text>
  <text x="176" y="17.5" fill="#6e4a7a" font-size="10">02:popup</text>
  <text x="320" y="17.5" fill="#2a2d36" font-size="10">hover a pane</text>
  <text x="1088" y="17.5" text-anchor="end" fill="#6ea37a" font-size="10">buntos@linux  local</text>

  <rect y="352" width="1100" height="28" fill="#0c0e12"/>
  <rect y="352" width="1100" height="1" fill="#2a2d36"/>
  <text x="14" y="370" fill="#c9b8a6" font-size="10" opacity="0.55">0:zsh</text>
  <text x="68" y="370" fill="#6e4a7a" font-size="10">review is the default</text>
  <text x="1088" y="370" text-anchor="end" fill="#c9b8a6" font-size="10" opacity="0.55">chorusdraft 0.53.2  /  adaegis 0.4.2</text>

  <g class="desktop">
    <g class="window win-cd" tabindex="0">
      <title>ChorusDraft review</title>
      <rect class="frame" x="28" y="42" width="512" height="300" fill="#0c0e12" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M28 54V42h12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M528 42h12v12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M540 330v12h-12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M40 342H28v-12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <g clip-path="url(#clip-cd)">
        <rect x="28" y="42" width="512" height="28" fill="#050508"/>
        <rect x="28" y="69" width="512" height="1" fill="#2a2d36"/>
        <rect x="40" y="53" width="6" height="6" fill="#6e4a7a"/>
        <rect x="50" y="53" width="6" height="6" fill="#2a2d36"/>
        <rect x="60" y="53" width="6" height="6" fill="#2a2d36"/>
        <text x="76" y="60" fill="#c9b8a6" font-size="11">chorusdraft / review</text>
        <text class="focus-tag" x="520" y="60" text-anchor="end" fill="#6e4a7a" font-size="10" opacity="0">FOCUS</text>
        <rect class="rail" x="28" y="70" width="2" height="272" fill="#6e4a7a" opacity="0.45"/>

        <g transform="translate(48 84)">
          <rect width="30" height="30" fill="#6e4a7a"/>
          <g transform="translate(4.4 4.4) scale(0.6625)" fill="none" stroke="#c9b8a6" stroke-linejoin="round">
            <path d="M7 12c0-4 4-7 9-7s9 3 9 7v6c0 4-4 7-9 7h-3l-6 3V12Z" stroke-width="2.4"/>
            <g stroke-width="2" stroke-linecap="round">
              <path class="eq eq1" d="M12 13v5"/>
              <path class="eq eq2" d="M16 10v11"/>
              <path class="eq eq3" d="M20 13v5"/>
            </g>
          </g>
        </g>
        <text x="90" y="97" fill="#c9b8a6" font-size="13">Review queue</text>
        <text x="90" y="113" fill="#c9b8a6" font-size="10" opacity="0.5">bluesky / original / local</text>
        <g transform="translate(428 88)">
          <rect width="92" height="22" fill="#050508" stroke="#6e4a7a"/>
          <circle class="pending-dot" cx="14" cy="11" r="2.2" fill="#6e4a7a"/>
          <text x="54" y="15" text-anchor="middle" fill="#6e4a7a" font-size="10">pending</text>
        </g>

        <rect x="48" y="128" width="472" height="148" fill="#050508" stroke="#2a2d36"/>
        <rect x="48" y="128" width="2" height="148" fill="#6e4a7a"/>
        <text x="64" y="150" fill="#6e4a7a" font-size="10">DRAFT / 97 chars</text>
        <text x="64" y="176" fill="#c9b8a6" font-size="13">The changelog was longer than the post.</text>
        <text x="64" y="196" fill="#c9b8a6" font-size="13">I stopped at: it still boots.</text>
        <text x="64" y="224" fill="#c9b8a6" font-size="11" opacity="0.62">Queued. You have the last say.</text>
        <text x="64" y="256" fill="#2a2d36" font-size="10" xml:space="preserve">y publish    d reject    e edit</text>

        <g transform="translate(48 292)">
          <rect width="92" height="28" fill="#050508" stroke="#2a2d36"/>
          <text x="46" y="18" text-anchor="middle" fill="#c9b8a6" font-size="11" opacity="0.7">Reject</text>
        </g>
        <g class="approve" transform="translate(152 292)">
          <rect class="approve-glow" x="-6" y="-6" width="124" height="40" fill="#7a2433" opacity="0"/>
          <rect class="approve-bg" width="112" height="28" fill="#050508" stroke="#7a2433" stroke-width="1"/>
          <text class="approve-label" x="56" y="18" text-anchor="middle" fill="#7a2433" font-size="11">Approve</text>
        </g>
      </g>
    </g>

    <g class="window win-aa" tabindex="0">
      <title>AdAegis popup</title>
      <rect class="frame" x="560" y="42" width="512" height="300" fill="#0c0e12" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M560 54V42h12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M1060 42h12v12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M1072 330v12h-12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <path class="tick" d="M572 342H560v-12" fill="none" stroke="#2a2d36" stroke-width="1"/>
      <g clip-path="url(#clip-aa)">
        <rect x="560" y="42" width="512" height="28" fill="#050508"/>
        <rect x="560" y="69" width="512" height="1" fill="#2a2d36"/>
        <rect x="572" y="53" width="6" height="6" fill="#6ea37a"/>
        <rect x="582" y="53" width="6" height="6" fill="#2a2d36"/>
        <rect x="592" y="53" width="6" height="6" fill="#2a2d36"/>
        <text x="608" y="60" fill="#c9b8a6" font-size="11">chromium / adaegis</text>
        <text class="focus-tag" x="1052" y="60" text-anchor="end" fill="#6ea37a" font-size="10" opacity="0">FOCUS</text>
        <rect class="rail" x="1070" y="70" width="2" height="272" fill="#6ea37a" opacity="0.45"/>

        <rect x="576" y="84" width="480" height="26" fill="#050508" stroke="#2a2d36"/>
        <rect x="586.5" y="93.5" width="7" height="6" fill="none" stroke="#6ea37a" stroke-width="1.15"/>
        <path d="M588 93.5v-1.7a2.1 2.1 0 0 1 4.2 0v1.7" fill="none" stroke="#6ea37a" stroke-width="1.15" stroke-linecap="round"/>
        <text x="602" y="101" fill="#c9b8a6" font-size="10" opacity="0.55">https://news.local/feed</text>
        <g transform="translate(1034 88)">
          <path d="M9 2.2l7.2 2.6c0 6.2-2.7 11.4-7.2 13.4C4.5 16.2 1.8 11 1.8 4.8Z" fill="#050508" stroke="#6ea37a" stroke-width="1.2"/>
        </g>

        <rect x="576" y="122" width="200" height="10" fill="#050508" stroke="#2a2d36"/>
        <rect x="576" y="140" width="176" height="8" fill="#050508" stroke="#2a2d36"/>
        <rect x="576" y="154" width="188" height="8" fill="#050508" stroke="#2a2d36"/>
        <rect x="576" y="178" width="200" height="72" fill="none" stroke="#2a2d36" stroke-dasharray="3 3"/>
        <text x="676" y="218" text-anchor="middle" fill="#7a2433" font-size="10">ad slot / blocked</text>
        <rect x="576" y="264" width="154" height="8" fill="#050508" stroke="#2a2d36"/>
        <rect x="576" y="280" width="120" height="8" fill="#050508" stroke="#2a2d36"/>
        <rect x="576" y="296" width="168" height="8" fill="#050508" stroke="#2a2d36"/>

        <g transform="translate(792 118)">
          <rect class="popup" width="248" height="206" fill="#050508" stroke="#2a2d36" stroke-width="1"/>
          <path class="tick" d="M0 10V0h10" fill="none" stroke="#2a2d36" stroke-width="1"/>
          <path class="tick" d="M238 0h10v10" fill="none" stroke="#2a2d36" stroke-width="1"/>
          <path class="tick" d="M248 196v10h-10" fill="none" stroke="#2a2d36" stroke-width="1"/>
          <path class="tick" d="M10 206H0v-10" fill="none" stroke="#2a2d36" stroke-width="1"/>
          <g transform="translate(16 14)">
            <path d="M14 1.8l11.2 4.1c0 9.6-4.2 17.8-11.2 21C6 23.7 1.8 15.5 1.8 5.9Z" fill="#050508" stroke="#6ea37a" stroke-width="1.4"/>
            <path d="M8.6 20.2 14 7.2l5.4 13" fill="none" stroke="#c9b8a6" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10.2 15.6h7.6" stroke="#6ea37a" stroke-width="1.8" stroke-linecap="round"/>
          </g>
          <text x="52" y="32" fill="#c9b8a6" font-size="14">AdAegis</text>
          <text x="232" y="32" text-anchor="end" fill="#c9b8a6" font-size="10" opacity="0.5">0.4.2</text>
          <circle class="live-dot" cx="52" cy="48" r="2.1" fill="#6ea37a"/>
          <text class="status" x="62" y="52" fill="#6ea37a" font-size="11">Protection on</text>
          <text class="count" x="16" y="92" fill="#7a2433" font-size="28">41</text>
          <text x="16" y="110" fill="#c9b8a6" font-size="10" opacity="0.55">blocked this tab</text>
          <text x="16" y="132" fill="#c9b8a6" font-size="10" opacity="0.4">network rules / local lists</text>
          <g class="pause" transform="translate(16 148)">
            <rect class="pause-bg" width="104" height="28" fill="#0c0e12" stroke="#2a2d36" stroke-width="1"/>
            <text class="pause-label" x="52" y="18" text-anchor="middle" fill="#c9b8a6" font-size="10">Pause 10 min</text>
          </g>
          <g class="pause" transform="translate(128 148)">
            <rect class="pause-bg" width="104" height="28" fill="#0c0e12" stroke="#2a2d36" stroke-width="1"/>
            <text class="pause-label" x="52" y="18" text-anchor="middle" fill="#c9b8a6" font-size="10">Pause 1 hour</text>
          </g>
          <text x="16" y="196" fill="#c9b8a6" font-size="9" opacity="0.4">Local settings. No telemetry.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
