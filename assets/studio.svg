<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="studio-title studio-desc" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif">
  <title id="studio-title">Buntos studio: Holdfast, ChorusDraft review, and AdAegis quietly holding a page</title>
  <desc id="studio-desc">Abstract dreamlike night studio. A lock between two foggy rooms: ChorusDraft keeps a draft for you to approve; AdAegis holds back an ad. Hover a pane to rest the other. Idle art is complete without hover.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="62%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <radialGradient id="moon-glow" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#e8e4f0" stop-opacity="0.55"/>
      <stop offset="22%" stop-color="#dfe6f5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="100%" r="58%">
      <stop offset="0%" stop-color="#7aa3b8" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#9bb0d4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cd-veil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a5b8" stop-opacity="0.16"/>
      <stop offset="48%" stop-color="#9bb0d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8e4f0" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="aa-veil" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7aa3b8" stop-opacity="0.20"/>
      <stop offset="52%" stop-color="#9bb0d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c4a5b8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4f0" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#9bb0d4" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="approve-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4a5b8"/>
      <stop offset="100%" stop-color="#9bb0d4"/>
    </linearGradient>
    <filter id="blur-wide" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="blur-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <style>
      <![CDATA[
        .stage { pointer-events: none; }
        .window { pointer-events: all; cursor: default; transition: opacity 0.45s ease; }
        .pane { transition: stroke-opacity 0.45s ease; }
        .stage:hover .window { opacity: 0.4; }
        .stage:hover .window:hover { opacity: 1; }
        .win-cd:hover .pane,
        .win-cd:focus-within .pane { stroke: #dfe6f5; stroke-opacity: 0.42; }
        .win-aa:hover .pane,
        .win-aa:focus-within .pane { stroke: #dfe6f5; stroke-opacity: 0.42; }
        .approve-bg, .approve-label, .blocked-num, .blocked-lbl, .status, .chip, .chip-label {
          transition: fill 0.28s ease, fill-opacity 0.28s ease;
        }
        .win-cd:hover .approve-bg,
        .win-cd:focus-within .approve-bg { fill: #e8e4f0; }
        .win-cd:hover .approve-label,
        .win-cd:focus-within .approve-label { fill: #0c1124; }
        .win-aa:hover .blocked-num,
        .win-aa:focus-within .blocked-num { fill: #dfe6f5; }
        .win-aa:hover .blocked-lbl,
        .win-aa:focus-within .blocked-lbl { fill: #e8e4f0; fill-opacity: 0.9; }
        .win-aa:hover .status,
        .win-aa:focus-within .status { fill: #dfe6f5; fill-opacity: 0.9; }
        .win-aa:hover .chip,
        .win-aa:focus-within .chip { fill: #c4a5b8; fill-opacity: 0.95; }
        .win-aa:hover .chip-label,
        .win-aa:focus-within .chip-label { fill: #0c1124; fill-opacity: 1; }
        .mote { animation: drift 7s ease-in-out infinite; }
        .mote-2 { animation: drift 9s ease-in-out infinite reverse; }
        @keyframes drift {
          0%, 100% { opacity: 0.35; }
          50% { opacity: 0.85; }
        }
        @media (prefers-reduced-motion: reduce) {
          .mote, .mote-2 { animation: none; }
          .window, .pane, .approve-bg, .approve-label, .blocked-num, .blocked-lbl, .status, .chip, .chip-label { transition: none; }
        }
      ]]>
    </style>
  </defs>

  <rect width="1100" height="400" fill="url(#night)"/>
  <rect width="1100" height="400" fill="url(#moon-glow)"/>
  <rect width="1100" height="400" fill="url(#pool)"/>

  <g filter="url(#blur-wide)" opacity="0.9">
    <ellipse cx="210" cy="70" rx="170" ry="64" fill="#9bb0d4" fill-opacity="0.22"/>
    <ellipse cx="430" cy="330" rx="220" ry="70" fill="#7aa3b8" fill-opacity="0.18"/>
    <ellipse cx="880" cy="300" rx="190" ry="80" fill="#c4a5b8" fill-opacity="0.16"/>
    <ellipse cx="700" cy="40" rx="140" ry="50" fill="#dfe6f5" fill-opacity="0.12"/>
  </g>

  <circle cx="980" cy="62" r="36" fill="#dfe6f5" fill-opacity="0.92"/>
  <circle cx="968" cy="54" r="12" fill="#e8e4f0" fill-opacity="0.35"/>
  <circle cx="992" cy="72" r="7" fill="#9bb0d4" fill-opacity="0.28"/>

  <g filter="url(#blur-soft)" opacity="0.8">
    <ellipse cx="160" cy="200" rx="90" ry="36" fill="#c4a5b8" fill-opacity="0.18"/>
    <ellipse cx="940" cy="210" rx="80" ry="30" fill="#7aa3b8" fill-opacity="0.2"/>
  </g>

  <text x="48" y="34" fill="#e8e4f0" fill-opacity="0.72" font-size="15">studio</text>
  <text x="108" y="34" fill="#9bb0d4" fill-opacity="0.7" font-size="13">rooms on the same night</text>
  <text x="1052" y="34" text-anchor="end" fill="#7aa3b8" fill-opacity="0.7" font-size="12">local, unhurried</text>

  <ellipse cx="550" cy="210" rx="46" ry="90" fill="#9bb0d4" fill-opacity="0.08"/>

  <g class="stage">
    <g class="window win-cd" tabindex="0">
      <title>ChorusDraft review</title>
      <rect class="pane" x="36" y="52" width="500" height="308" rx="36" fill="#0c1124" fill-opacity="0.78" stroke="#c4a5b8" stroke-opacity="0.22" stroke-width="1.6"/>
      <rect x="36" y="52" width="500" height="308" rx="36" fill="url(#cd-veil)"/>
      <ellipse cx="92" cy="88" rx="54" ry="28" fill="#c4a5b8" fill-opacity="0.14"/>

      <g transform="translate(62 76)">
        <ellipse cx="16" cy="16" rx="18" ry="16" fill="#c4a5b8" fill-opacity="0.88"/>
        <path d="M8 28c4-2 10-2 16 1" fill="#c4a5b8" fill-opacity="0.7"/>
        <g fill="#0c1124" fill-opacity="0.72">
          <rect x="9" y="12" width="3.2" height="9" rx="1.6"/>
          <rect x="14.4" y="8" width="3.2" height="13" rx="1.6"/>
          <rect x="19.8" y="12" width="3.2" height="9" rx="1.6"/>
        </g>
      </g>
      <text x="108" y="94" fill="#e8e4f0" font-size="22">ChorusDraft</text>
      <text x="108" y="114" fill="#c4a5b8" fill-opacity="0.9" font-size="13">a review, still yours</text>
      <g transform="translate(392 78)">
        <rect width="118" height="26" rx="13" fill="#9bb0d4" fill-opacity="0.18"/>
        <circle class="mote" cx="16" cy="13" r="3.2" fill="#dfe6f5"/>
        <text x="70" y="17" text-anchor="middle" fill="#dfe6f5" fill-opacity="0.9" font-size="11">waiting</text>
      </g>

      <rect x="62" y="132" width="448" height="148" rx="24" fill="url(#card)"/>
      <rect x="62" y="132" width="448" height="148" rx="24" fill="#e8e4f0" fill-opacity="0.04" stroke="#dfe6f5" stroke-opacity="0.16" stroke-width="1.2"/>
      <text x="86" y="160" fill="#9bb0d4" font-size="12">draft  /  ninety-seven characters</text>
      <text x="86" y="188" fill="#e8e4f0" font-size="16">The changelog was longer than the post.</text>
      <text x="86" y="212" fill="#dfe6f5" font-size="16">I stopped at: it still boots.</text>
      <text x="86" y="248" fill="#c4a5b8" fill-opacity="0.85" font-size="13">Queued. You have the last say.</text>

      <g transform="translate(62 296)">
        <rect width="108" height="32" rx="16" fill="#7aa3b8" fill-opacity="0.12" stroke="#7aa3b8" stroke-opacity="0.28" stroke-width="1.2"/>
        <text x="54" y="21" text-anchor="middle" fill="#9bb0d4" font-size="13">Reject</text>
      </g>
      <g class="approve" transform="translate(182 296)">
        <rect class="approve-bg" width="128" height="32" rx="16" fill="url(#approve-fill)"/>
        <text class="approve-label" x="64" y="21" text-anchor="middle" fill="#0c1124" font-size="13">Approve</text>
      </g>
    </g>

    <g class="window win-aa" tabindex="0">
      <title>AdAegis popup</title>
      <rect class="pane" x="564" y="52" width="500" height="308" rx="36" fill="#0c1124" fill-opacity="0.8" stroke="#7aa3b8" stroke-opacity="0.24" stroke-width="1.6"/>
      <rect x="564" y="52" width="500" height="308" rx="36" fill="url(#aa-veil)"/>
      <ellipse cx="1008" cy="86" rx="58" ry="26" fill="#7aa3b8" fill-opacity="0.16"/>

      <text x="588" y="86" fill="#e8e4f0" font-size="22">AdAegis</text>
      <text x="588" y="106" fill="#7aa3b8" font-size="13">news.local/feed, a little quieter</text>

      <g transform="translate(588 122)">
        <rect width="196" height="214" rx="22" fill="#e8e4f0" fill-opacity="0.05" stroke="#9bb0d4" stroke-opacity="0.16" stroke-width="1.2"/>
        <rect x="16" y="16" width="118" height="10" rx="5" fill="#dfe6f5" fill-opacity="0.28"/>
        <rect x="16" y="36" width="164" height="7" rx="3.5" fill="#9bb0d4" fill-opacity="0.22"/>
        <rect x="16" y="50" width="148" height="7" rx="3.5" fill="#9bb0d4" fill-opacity="0.16"/>
        <ellipse cx="98" cy="118" rx="72" ry="38" fill="#c4a5b8" fill-opacity="0.16"/>
        <ellipse cx="98" cy="118" rx="48" ry="24" fill="#9bb0d4" fill-opacity="0.12"/>
        <text x="98" y="122" text-anchor="middle" fill="#c4a5b8" fill-opacity="0.85" font-size="11">held back</text>
        <rect x="16" y="168" width="132" height="7" rx="3.5" fill="#7aa3b8" fill-opacity="0.2"/>
        <rect x="16" y="184" width="96" height="7" rx="3.5" fill="#7aa3b8" fill-opacity="0.14"/>
      </g>

      <g transform="translate(800 118)">
        <rect width="240" height="218" rx="28" fill="#0c1124" fill-opacity="0.92" stroke="#dfe6f5" stroke-opacity="0.2" stroke-width="1.4"/>
        <rect width="240" height="218" rx="28" fill="url(#card)"/>
        <g transform="translate(22 22)">
          <path d="M16 2.4l12.4 4.2c0 10.4-4.6 19.2-12.4 22.6C7.8 25.8 3.2 17 3.2 6.6Z" fill="#7aa3b8" fill-opacity="0.85"/>
          <path d="M16 8.5v8.2" fill="none" stroke="#e8e4f0" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="16" cy="20.4" r="1.4" fill="#e8e4f0"/>
        </g>
        <text x="58" y="42" fill="#e8e4f0" font-size="16">AdAegis</text>
        <text x="216" y="42" text-anchor="end" fill="#9bb0d4" fill-opacity="0.7" font-size="11">0.4.2</text>
        <circle class="mote-2" cx="64" cy="62" r="3" fill="#7aa3b8"/>
        <text class="status" x="76" y="66" fill="#dfe6f5" fill-opacity="0.75" font-size="12">protection on</text>
        <text class="blocked-num" x="24" y="114" fill="#dfe6f5" font-size="36">41</text>
        <text class="blocked-lbl" x="24" y="136" fill="#9bb0d4" fill-opacity="0.85" font-size="12">blocked this tab</text>
        <g transform="translate(148 92)">
          <rect class="chip" width="70" height="22" rx="11" fill="#c4a5b8" fill-opacity="0.28"/>
          <text class="chip-label" x="35" y="15" text-anchor="middle" fill="#e8e4f0" fill-opacity="0.9" font-size="10">quiet</text>
        </g>
        <text x="24" y="158" fill="#7aa3b8" fill-opacity="0.75" font-size="11">lists that stay on the machine</text>
        <g transform="translate(24 172)">
          <rect width="92" height="28" rx="14" fill="#7aa3b8" fill-opacity="0.16"/>
          <text x="46" y="18" text-anchor="middle" fill="#dfe6f5" font-size="11">Pause 10 min</text>
        </g>
        <g transform="translate(124 172)">
          <rect width="92" height="28" rx="14" fill="#9bb0d4" fill-opacity="0.16"/>
          <text x="46" y="18" text-anchor="middle" fill="#dfe6f5" font-size="11">Pause 1 hour</text>
        </g>
      </g>
    </g>
  </g>

  <g tabindex="0">
    <title>Holdfast</title>
    <ellipse cx="550" cy="200" rx="34" ry="42" fill="#0c1124" fill-opacity="0.72"/>
    <path d="M538 196v-11c0-6.6 5.4-12 12-12s12 5.4 12 12v11" fill="none" stroke="#dfe6f5" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="534" y="194" width="32" height="24" rx="6" fill="#9bb0d4" fill-opacity="0.9"/>
    <circle cx="550" cy="204" r="2.2" fill="#0c1124"/>
    <rect x="548.6" y="204" width="2.8" height="8" rx="1.4" fill="#0c1124"/>
    <text x="550" y="236" text-anchor="middle" fill="#e8e4f0" fill-opacity="0.88" font-size="11">Holdfast</text>
  </g>

  <text x="48" y="384" fill="#9bb0d4" fill-opacity="0.55" font-size="11">holdfast · chorusdraft 0.53.2</text>
  <text x="1052" y="384" text-anchor="end" fill="#c4a5b8" fill-opacity="0.55" font-size="11">adaegis 0.4.2</text>
</svg>
