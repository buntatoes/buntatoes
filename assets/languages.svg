    </circle>
    <circle cx="210" cy="96" r="1.1" opacity="0.3">
      <animate attributeName="opacity" values="0.12;0.48;0.12" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="44" r="1.3" opacity="0.4">
      <animate attributeName="opacity" values="0.18;0.55;0.18" dur="6.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="62" r="1.1" opacity="0.28">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="38" r="1.4" opacity="0.38">
      <animate attributeName="opacity" values="0.16;0.58;0.16" dur="5s" repeatCount="indefinite"/>
