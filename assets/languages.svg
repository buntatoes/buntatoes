<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Languages drifting through years</title>
  <desc id="desc">A night sky of fifteen programming languages, placed by the year they appeared. Ruby (1995) and Elixir (2011) keep a little extra light. Hover the image and the moonlight gathers; Elixir and Ruby swell. ChorusDraft is Elixir.</desc>

  <style type="text/css">
    <![CDATA[
      .moonlight,
      .moon-brighten,
      .ruby-swell,
      .elixir-swell {
        transition: opacity 0.9s ease, transform 0.7s ease;
      }
      .ruby-swell,
      .elixir-swell {
        transform-box: fill-box;
        transform-origin: center;
      }
      .moon-brighten { opacity: 0; }
      svg:hover .moonlight { opacity: 1; }
      svg:hover .moon-brighten { opacity: 0.28; }
      svg:hover .ruby-swell { transform: scale(1.22); }
      svg:hover .elixir-swell { transform: scale(1.18); }

      @media (prefers-reduced-motion: reduce) {
        animate,
        animateTransform {
          display: none !important;
        }
        .moonlight,
        .moon-brighten,
        .ruby-swell,
        .elixir-swell {
          transition: none !important;
        }
      }
    ]]>
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="52%" stop-color="#0c1124"/>
      <stop offset="100%" stop-color="#090b16"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6f5" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#9bb0d4" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#7aa3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a5b8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c4a5b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="water" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa3b8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7aa3b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lilac" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8e4f0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#e8e4f0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ruby-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a5b8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#c4a5b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="elixir-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6f5" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#e8e4f0" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7aa3b8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1100" height="460" fill="url(#sky)"/>

  <g fill="#dfe6f5">
    <circle cx="70" cy="58" r="1.2" opacity="0.35">
