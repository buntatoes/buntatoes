    </circle>
    <circle cx="390" cy="300" r="1.1" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.42;0.1" dur="7.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="710" cy="210" r="1" opacity="0.2">
