    <path d="M148,312 C240,280 360,250 418,228"/>
    <path d="M498,72 C530,110 548,140 548,158"/>
    <path d="M548,158 C560,210 568,250 572,268"/>
    <path d="M818,98 C840,140 858,180 872,198"/>
    <path d="M872,198 C910,170 930,156 948,152"/>
