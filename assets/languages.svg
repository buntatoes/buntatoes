    <circle cx="1040" cy="88" r="1.2" opacity="0.32">
      <animate attributeName="opacity" values="0.14;0.5;0.14" dur="6.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="220" r="1" opacity="0.22">
