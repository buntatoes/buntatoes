<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="t d">
  <title id="t">Vespers</title>
  <desc id="d">Dark ember bar in oxblood and violet.</desc>
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0a10"/>
      <stop offset="1" stop-color="#07060a"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2a0c14"/>
      <stop offset="0.5" stop-color="#7a2433"/>
      <stop offset="1" stop-color="#c45c6a"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1c1424"/>
      <stop offset="1" stop-color="#8b6b9e"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" rx="12" fill="url(#void)"/>
  <g fill="url(#blood)">
    <ellipse cx="240" cy="214" rx="62" ry="96">
      <animate attributeName="ry" values="88;108;94;102;88" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="430" cy="216" rx="80" ry="130">
      <animate attributeName="ry" values="118;142;124;136;118" dur="2.8s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="550" cy="218" rx="110" ry="155">
      <animate attributeName="ry" values="140;168;148;160;140" dur="3.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="680" cy="216" rx="76" ry="128">
      <animate attributeName="ry" values="114;138;120;132;114" dur="2.6s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="214" rx="58" ry="92">
      <animate attributeName="ry" values="84;104;90;98;84" dur="2.9s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <ellipse cx="500" cy="216" rx="26" ry="78" fill="url(#violet)" opacity="0.75">
    <animate attributeName="ry" values="70;88;76;82;70" dur="3.4s" repeatCount="indefinite"/>
  </ellipse>
  <text x="550" y="42" text-anchor="middle" fill="#e4d6c5" font-family="Georgia, serif" font-size="13" letter-spacing="8">BUNTOS</text>
