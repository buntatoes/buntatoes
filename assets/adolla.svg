<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="220" viewBox="0 0 1100 220" role="img" aria-labelledby="t d">
  <title id="t">Adolla tribute flames</title>
  <desc id="d">Original Fire Force-inspired ember bar. Flames flicker; not official art.</desc>
  <defs>
    <linearGradient id="ash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c08"/>
      <stop offset="1" stop-color="#070403"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7a1400"/>
      <stop offset="0.45" stop-color="#ff4d12"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#7ecbff"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="220" rx="12" fill="url(#ash)"/>
  <circle cx="550" cy="48" r="18" fill="none" stroke="#ff6a1a" stroke-width="3"/>
  <text x="550" y="55" text-anchor="middle" fill="#ffd27a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">8</text>
  <g fill="url(#flame)">
    <ellipse cx="220" cy="210" rx="70" ry="110">
      <animate attributeName="ry" values="100;124;108;118;100" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220;228;214;220" dur="2.1s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="400" cy="214" rx="90" ry="150">
      <animate attributeName="ry" values="140;168;148;160;140" dur="1.35s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="550" cy="216" rx="120" ry="175">
      <animate attributeName="ry" values="160;190;170;184;160" dur="1.15s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="720" cy="214" rx="86" ry="145">
      <animate attributeName="ry" values="130;158;140;150;130" dur="1.45s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="890" cy="210" rx="64" ry="108">
      <animate attributeName="ry" values="96;120;104;112;96" dur="1.8s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <ellipse cx="610" cy="214" rx="28" ry="90" fill="url(#blue)" opacity="0.85">
    <animate attributeName="ry" values="80;100;86;94;80" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>
  <text x="550" y="198" text-anchor="middle" fill="#f4ebe3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="3">PUT IT OUT</text>
</svg>
