<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="90" viewBox="0 0 1100 90" role="img" aria-labelledby="t d" overflow="hidden">
  <title id="t">Mist horizon</title>
  <desc id="d">Dreamlike mist horizon: night fog banks, a faint moon-line, and slow SMIL drift. No ticks, no signal cells.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1124"/>
      <stop offset="42%" stop-color="#0c1124"/>
      <stop offset="72%" stop-color="#7aa3b8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#9bb0d4" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0c1124" stop-opacity="0"/>
      <stop offset="18%" stop-color="#c4a5b8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#dfe6f5" stop-opacity="0.32"/>
      <stop offset="82%" stop-color="#9bb0d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="moonline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dfe6f5" stop-opacity="0"/>
      <stop offset="36%" stop-color="#9bb0d4" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#dfe6f5" stop-opacity="0.7"/>
      <stop offset="64%" stop-color="#c4a5b8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#dfe6f5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6f5" stop-opacity="0.92"/>
      <stop offset="42%" stop-color="#dfe6f5" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#9bb0d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dfe6f5" stop-opacity="0.42"/>
      <stop offset="52%" stop-color="#9bb0d4" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c4a5b8" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#7aa3b8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7aa3b8" stop-opacity="0.4"/>
      <stop offset="48%" stop-color="#9bb0d4" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0c1124" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-25%" y="-50%" width="150%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softer" x="-35%" y="-60%" width="170%" height="220%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="1100" height="90" fill="#0c1124"/>
  <rect width="1100" height="90" fill="url(#sky)"/>

  <circle cx="168" cy="18" r="1.1" fill="#dfe6f5" opacity="0.28"/>
  <circle cx="312" cy="12" r="0.9" fill="#9bb0d4" opacity="0.32"/>
  <circle cx="704" cy="16" r="1.2" fill="#dfe6f5" opacity="0.24"/>
  <circle cx="892" cy="10" r="0.8" fill="#c4a5b8" opacity="0.3"/>
  <circle cx="1018" cy="20" r="1" fill="#9bb0d4" opacity="0.22"/>

  <ellipse cx="550" cy="30" rx="120" ry="22" fill="url(#moon)" filter="url(#soft)"/>
  <circle cx="550" cy="34" r="8" fill="#dfe6f5" opacity="0.55"/>
  <circle cx="550" cy="34" r="18" fill="#9bb0d4" opacity="0.16" filter="url(#soft)"/>

  <rect x="70" y="41" width="960" height="1.15" fill="url(#moonline)"/>
  <rect x="180" y="38" width="740" height="6" fill="url(#veil)" opacity="0.4" filter="url(#soft)"/>

  <g>
    <ellipse cx="180" cy="62" rx="220" ry="30" fill="url(#mistB)" filter="url(#softer)"/>
    <ellipse cx="470" cy="70" rx="270" ry="34" fill="url(#mistA)" filter="url(#softer)"/>
    <ellipse cx="780" cy="64" rx="250" ry="32" fill="url(#mistC)" filter="url(#softer)"/>
    <ellipse cx="1000" cy="72" rx="190" ry="28" fill="url(#mistB)" filter="url(#softer)"/>
    <animateTransform attributeName="transform" type="translate" values="-40 0; 30 0; -40 0" dur="22s" repeatCount="indefinite"/>
  </g>
  <g>
    <ellipse cx="90" cy="80" rx="200" ry="24" fill="url(#mistC)" filter="url(#soft)"/>
    <ellipse cx="540" cy="84" rx="300" ry="26" fill="url(#mistA)" filter="url(#soft)"/>
    <ellipse cx="930" cy="82" rx="220" ry="24" fill="url(#mistB)" filter="url(#soft)"/>
    <animateTransform attributeName="transform" type="translate" values="26 0; -34 0; 26 0" dur="16s" repeatCount="indefinite"/>
  </g>

  <rect x="0" y="70" width="1100" height="20" fill="url(#veil)" opacity="0.42"/>
  <rect x="0" y="80" width="1100" height="10" fill="#0c1124" opacity="0.28"/>
</svg>
