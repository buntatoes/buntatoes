<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="96" viewBox="0 0 1100 96" role="img" aria-labelledby="t d">
  <title id="t">Carrier strip</title>
  <desc id="d">Black-and-white goth signal bar. SIG cells, LOCK. Hover to lock the carrier.</desc>
  <defs>
    <style>
      <![CDATA[
        .ui {
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          font-size: 11px;
        }
        .lbl {
          font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
          font-size: 10px;
          letter-spacing: 3.2px;
        }
        .cell-off { fill: #000000; stroke: #2e2e2e; }
        .cell-dim { fill: #8a8a8a; stroke: #8a8a8a; }
        .cell-on { fill: #e8e8e8; stroke: #e8e8e8; }
        .rule { stroke: #e8e8e8; opacity: 0.55; }
        .rail { stroke: #8a8a8a; opacity: 0.7; }
        .mark { stroke: #8a8a8a; opacity: 0.55; }
        .pip { fill: #ffffff; opacity: 0.85; }
        .lock { fill: #8a8a8a; }
        .sig { fill: #e8e8e8; }
        .index { stroke: #8a8a8a; }
        .bracket { stroke: #e8e8e8; }
        .frame { stroke: #2e2e2e; }
        svg:hover .cell-off,
        .stage:hover .cell-off { fill: #8a8a8a; stroke: #8a8a8a; }
        svg:hover .cell-dim,
        .stage:hover .cell-dim { fill: #e8e8e8; stroke: #e8e8e8; }
        svg:hover .cell-on,
        .stage:hover .cell-on { fill: #ffffff; stroke: #ffffff; }
        svg:hover .rule,
        .stage:hover .rule { opacity: 1; }
        svg:hover .rail,
        .stage:hover .rail { opacity: 1; stroke: #e8e8e8; }
        svg:hover .mark,
        .stage:hover .mark { opacity: 1; stroke: #e8e8e8; }
        svg:hover .pip,
        .stage:hover .pip { opacity: 1; }
        svg:hover .lock,
        .stage:hover .lock { fill: #ffffff; }
        svg:hover .index,
        .stage:hover .index { stroke: #ffffff; }
        svg:hover .frame,
        .stage:hover .frame { stroke: #8a8a8a; }
        svg:hover .bracket,
        .stage:hover .bracket { stroke: #ffffff; }
        @media (prefers-reduced-motion: no-preference) {
          .cell-on { animation: breathe 2.8s ease-in-out infinite; }
        }
        @media (prefers-reduced-motion: reduce) {
          .cell-on { animation: none; }
          .pip-run { display: none; }
        }
        @keyframes breathe {
          0%, 100% { opacity: 0.55; }
          50% { opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <g class="stage">
    <rect width="1100" height="96" fill="#000000"/>
    <rect class="frame" x="0.5" y="0.5" width="1099" height="95" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="1"/>
    <rect class="frame" x="4.5" y="4.5" width="1091" height="87" fill="none" stroke="#2e2e2e" stroke-width="1"/>

    <path class="bracket" d="M8 18V8H18" fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <path class="bracket" d="M1082 8H1092V18" fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <path class="bracket" d="M1092 78V88H1082" fill="none" stroke="#e8e8e8" stroke-width="1"/>
    <path class="bracket" d="M18 88H8V78" fill="none" stroke="#e8e8e8" stroke-width="1"/>

    <line class="rule" x1="20" y1="16.5" x2="1080" y2="16.5" stroke="#e8e8e8" stroke-width="1"/>
    <rect class="pip pip-run" x="20" y="15" width="12" height="3" fill="#ffffff">
      <animate attributeName="x" values="20;1068;20" dur="4.2s" repeatCount="indefinite"/>
    </rect>

    <text class="lbl sig" x="20" y="48" fill="#e8e8e8">SIG</text>
    <g transform="translate(64 34)" stroke-width="1">
      <rect class="cell-on" x="0" y="10" width="12" height="6" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="16" y="8" width="12" height="8" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="32" y="6" width="12" height="10" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="48" y="5" width="12" height="11" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="64" y="4" width="12" height="12" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="80" y="3" width="12" height="13" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="96" y="2" width="12" height="14" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-on" x="112" y="1" width="12" height="15" fill="#e8e8e8" stroke="#e8e8e8"/>
      <rect class="cell-dim" x="128" y="0" width="12" height="16" fill="#8a8a8a" stroke="#8a8a8a"/>
      <rect class="cell-dim" x="144" y="0" width="12" height="16" fill="#8a8a8a" stroke="#8a8a8a"/>
      <rect class="cell-off" x="160" y="0" width="12" height="16" fill="#000000" stroke="#2e2e2e"/>
      <rect class="cell-off" x="176" y="0" width="12" height="16" fill="#000000" stroke="#2e2e2e"/>
    </g>

    <g class="index" fill="none" stroke="#8a8a8a" stroke-width="1">
      <circle cx="550" cy="44" r="7"/>
      <path d="M550 37v14M543 44h14"/>
    </g>

    <text class="ui lock" x="1080" y="48" text-anchor="end" fill="#8a8a8a">LOCK</text>

    <line class="rail" x1="20" y1="72.5" x2="1080" y2="72.5" stroke="#8a8a8a" stroke-width="1"/>
    <g class="mark" fill="none" stroke="#8a8a8a" stroke-width="1">
      <path d="M20 68v9"/>
      <path d="M84 70v5"/>
      <path d="M148 70v5"/>
      <path d="M212 70v5"/>
      <path d="M276 68v9"/>
      <path d="M340 70v5"/>
      <path d="M404 70v5"/>
      <path d="M468 70v5"/>
      <path d="M532 68v9"/>
      <path d="M596 70v5"/>
      <path d="M660 70v5"/>
      <path d="M724 70v5"/>
      <path d="M788 68v9"/>
      <path d="M852 70v5"/>
      <path d="M916 70v5"/>
      <path d="M980 70v5"/>
      <path d="M1080 68v9"/>
    </g>
  </g>
</svg>
