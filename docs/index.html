<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buntos</title>
  <meta name="description" content="Buntos. Local tools. Human review. Linux. A desk of four little bots." />
  <meta name="theme-color" content="#101218" />
  <meta property="og:title" content="Buntos" />
  <meta property="og:description" content="Local tools. Human review. Linux." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="./desk.css" />
</head>
<body>
  <a class="skip" href="#workspace">Skip to workspace</a>

  <div class="desk">
    <aside class="rail">
      <header class="brand">
        <p class="brand-name">buntos</p>
        <p class="brand-tag">local tools · human review · linux</p>
      </header>

      <div
        id="roster"
        class="roster"
        role="listbox"
        tabindex="0"
        aria-label="Bots"
        aria-activedescendant=""
      ></div>

      <p class="rail-hint">click a face · 1–4 · j / k</p>

      <footer class="rail-foot">
        <a href="./langs.html">languages</a>
        <a href="https://github.com/buntatoes">GitHub</a>
      </footer>
    </aside>

    <main id="workspace" class="workspace">
      <header class="work-head">
        <div class="work-face" id="work-face" aria-hidden="true"></div>
        <div class="work-id">
          <h1 id="bot-name">—</h1>
          <p id="bot-title" class="work-title"></p>
        </div>
        <p id="status-verb" class="status-verb" data-status="idle">idle</p>
      </header>

      <p id="bot-about" class="about"></p>
      <p class="visit-wrap">
        <a id="bot-visit" class="visit" href="#" hidden></a>
      </p>

      <div id="chips" class="chips" role="group" aria-label="Prompts"></div>

      <section class="surface" aria-label="Transcript">
        <p id="empty-hint" class="empty">Ask the bot. The answer lands here.</p>
        <div id="transcript" class="transcript" aria-live="polite" aria-relevant="additions"></div>
      </section>
    </main>
  </div>

  <noscript>
    <div class="noscript">
      <p>This desk needs JavaScript. Meanwhile:</p>
      <ul>
        <li><a href="https://github.com/buntatoes/holdfast">Holdfast</a> — Linux gate</li>
        <li><a href="https://github.com/buntatoes/chorusdraft">ChorusDraft</a> — social drafts</li>
        <li><a href="https://github.com/buntatoes/adaegis">AdAegis</a> — ad blocker</li>
        <li><a href="./langs.html">languages</a> — constellation</li>
      </ul>
    </div>
  </noscript>

  <script src="./desk.js"></script>
</body>
</html>
