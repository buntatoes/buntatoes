<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buntos</title>
  <meta name="description" content="Buntos. Local tools. Human review. Linux." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="Buntos" />
  <meta property="og:description" content="Local tools. Human review. Linux." />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" href="./board.css?v=bw1" />
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <header class="hud frame">
    <p class="mark">buntos<span class="dim">@</span>void</p>
    <p id="clock" class="clock">--:--:--</p>
    <nav aria-label="Projects">
      <a href="./langs.html">languages</a>
      <a href="https://github.com/buntatoes/chorusdraft">ChorusDraft</a>
      <a href="https://github.com/buntatoes/adaegis">AdAegis</a>
      <a href="https://github.com/buntatoes">github</a>
    </nav>
  </header>
  <main>
    <section>
      <h1>Buntos</h1>
      <p class="lede">Local tools. Human review. Linux.</p>
      <ul class="nodes" id="nodes"></ul>
      <article class="frame dossier">
        <p class="kicker" id="kicker">01 // local tools</p>
        <p id="copy">Pointer on the scope. Keys 1 2 3 dock a node.</p>
      </article>
    </section>
    <section>
      <div class="frame scope-frame">
        <div class="scope-meta">
          <span>scope</span>
          <span id="scope-readout">idle sine</span>
        </div>
        <canvas id="scope" width="720" height="280" aria-label="Oscilloscope. Pointer changes frequency and amplitude."></canvas>
      </div>
      <p class="hint">Pointer on the grid drives frequency and amplitude. Keys 1 2 3, j/k, or click a node.</p>
    </section>
  </main>
  <script src="./board.js?v=bw1"></script>
</body>
</html>
