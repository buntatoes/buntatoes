<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">buntos</title>
  <desc id="banner-desc">Four little bots on a dark desk: Holdfast, ChorusDraft, AdAegis, and Lang.</desc>
  <defs>
    <linearGradient id="studio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12141c"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#e8d5a3" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#e8d5a3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="720" height="220" rx="28" fill="url(#studio)"/>
  <rect width="720" height="220" rx="28" fill="url(#spot)"/>
  <text x="360" y="42" text-anchor="middle" fill="#f4f1ea" font-family="Georgia, 'Times New Roman', serif" font-size="28">buntos</text>
  <text x="360" y="64" text-anchor="middle" fill="#8b8d97" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" letter-spacing="1.4">local tools · human review · linux</text>

