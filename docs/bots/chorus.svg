<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title-chorus desc-chorus">
  <title id="title-chorus">ChorusDraft</title>
  <desc id="desc-chorus">Warm rose rounded-square bot with wide friendly eyes and two tiny sound-wave arcs.</desc>
  <g class="bot-face">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3.5; 0 0" dur="3.8s" repeatCount="indefinite"/>
    <rect class="bot-body" x="28" y="28" width="72" height="72" rx="24" fill="#D0A4B0"/>
    <g class="bot-accessory" fill="none" stroke="#8E5C6A" stroke-width="3.2" stroke-linecap="round" aria-hidden="true">
      <path d="M98 52 a8 8 0 0 0 0 -14"/>
      <path d="M105 56 a15 15 0 0 0 0 -22"/>
    </g>
    <g class="bot-eyes" fill="#1A1D26">
      <ellipse class="bot-eye bot-eye-l" cx="50" cy="64" rx="6.4" ry="7.4">
        <animate attributeName="ry" values="7.4;7.4;0.8;7.4;7.4" keyTimes="0;0.86;0.90;0.94;1" dur="5s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse class="bot-eye bot-eye-r" cx="78" cy="64" rx="6.4" ry="7.4">
        <animate attributeName="ry" values="7.4;7.4;0.8;7.4;7.4" keyTimes="0;0.86;0.90;0.94;1" dur="5s" begin="0.08s" repeatCount="indefinite"/>
      </ellipse>
    </g>
  </g>
</svg>
